# Corre el bot cada 15 minutos usando GitHub Actions (gratis). En cada corrida
# el script chequea tanto H4 como M15 y solo manda alerta si hay un cruce
# fresco de EMA en la vela recién cerrada de cada temporalidad.
#
# Nota: GitHub no garantiza precisión exacta en los cron schedules (puede
# demorar unos minutos en horarios de mucha carga), pero para esta estrategia
# no es un problema: igual detecta el cruce en cuanto corre.

name: Alertas BTC H4 + M15

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write  # necesario para que el workflow pueda commitear el state.json

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_btc_h4.py

      - name: Guardar estado (evita alertas duplicadas)
        run: |
          git config user.name "btc-alert-bot"
          git config user.email "btc-alert-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Actualiza estado de alertas [skip ci]"
          git push
