# Workflow aparte, solo para probar manualmente que el token/chat_id de
# Telegram están bien configurados. No corre solo, hay que dispararlo a mano
# desde la pestaña Actions ("Run workflow").

name: Test Telegram

on:
  workflow_dispatch: {}

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Mandar mensaje de prueba
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_btc_h4.py --test-telegram
